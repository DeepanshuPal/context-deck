name: mac-app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: "package-lock.json"}
      - run: npm ci
      - run: npm ci
        working-directory: apps/mac
      - run: npm run dist
        working-directory: apps/mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check contextdeck:// is registered in the app bundle
        working-directory: apps/mac/release
        run: |
          plist="mac-arm64/Context Deck.app/Contents/Info.plist"
          plutil -p "$plist" | tee /tmp/plist.txt | grep -A6 CFBundleURLTypes
          grep -q '"contextdeck"' /tmp/plist.txt
      - name: Smoke-launch the packaged app
        working-directory: apps/mac/release
        run: |
          export CONTEXT_DECK_DB="$RUNNER_TEMP/deck.db"
          "mac-arm64/Context Deck.app/Contents/MacOS/Context Deck" --remote-debugging-port=9333 > "$RUNNER_TEMP/app.log" 2>&1 &
          # Wait until the window has loaded the local UI (title is set once index.html is parsed).
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9333/json/list > "$RUNNER_TEMP/pages.json" || true
            grep -q '"title": "Context Deck"' "$RUNNER_TEMP/pages.json" 2>/dev/null && break
            sleep 1
          done
          cat "$RUNNER_TEMP/pages.json"
          grep -q '"title": "Context Deck"' "$RUNNER_TEMP/pages.json"
          app_url=$(grep -o '"url": "http://127.0.0.1:[0-9]*/"' "$RUNNER_TEMP/pages.json" | head -1 | cut -d'"' -f4)
          curl -sf "${app_url}api/info" | tee "$RUNNER_TEMP/info.json"; echo
          grep -q "$CONTEXT_DECK_DB" "$RUNNER_TEMP/info.json"
          test -f "$CONTEXT_DECK_DB"
          pkill -f "Context Deck.app" || true
      - uses: actions/upload-artifact@v4
        with:
          name: context-deck-mac
          path: |
            apps/mac/release/*.dmg
            apps/mac/release/*.zip
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mac/release/*.dmg
            apps/mac/release/*.zip
